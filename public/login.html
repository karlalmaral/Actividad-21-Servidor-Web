<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Actividad 22</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <h1>Inicio de sesión</h1>
    <nav class="menu">
        <a href="/">Inicio</a>
        <a href="/login.html">Login</a>
        <a href="/alumnos.html">Alumnos</a>
        <a href="/materias.html">Materias</a>
    </nav>
    <main class="tarjeta">
        <p>Esta página solo demuestra que el servidor puede entregar archivos HTML. La autenticación todavía no está implementada.</p>
        <form action="/login.html" method="get">
            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario" type="text" autocomplete="off">
            <label for="clave">Contraseña</label>
            <input id="clave" name="clave" type="password" autocomplete="off">
            <button type="submit" disabled>Entrar (pendiente)</button>
        </form>
        <p data-js>JavaScript no cargado.</p>
    </main>
    <footer>Actividad 22 - Servidor de archivos estáticos en C++</footer>
    <script src="/js/app.js" defer></script>
</body>
